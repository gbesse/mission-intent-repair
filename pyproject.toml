[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mission-intent-repair"
version = "0.1.0a2"
description = "Réparer un planning de mission · Repair a mission schedule · Reparar un plan de misión"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["ortools==9.15.6755"]

[project.scripts]
mission-repair = "mission_repair.__main__:main"

[tool.setuptools.packages.find]
include = ["mission_repair*"]

[tool.setuptools.package-data]
mission_repair = ["web/*", "examples/*"]
